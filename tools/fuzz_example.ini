; Cloud fuzzer: tools/cloud_bake --fuzz tools/fuzz_example.ini [--out-dir fuzz]
; Every run is kept: fuzz/N.png (from below, the side, above) and fuzz/N.txt
; (what grew it; grow it again with --params fuzz/N.txt --grid 128 --out ...)
;
; In [ranges]: any knob (cloud_bake --help, without the dashes), vorticity
; or seed.  "low, high" = uniform between them, one number = fixed, a line
; left out (or commented) = the type's own value.

[run]
type = mediocris        ; humilis, mediocris, congestus, storm: the starting values
grid = 64               ; 64 to search, 128 for the keepers
runs = 100

[ranges]
; The thermals: how warm, wide, wet, how long the ground heats
thermal-warmth = 0.5, 3          ; C over the air around them
thermal-radius = 15, 45          ; % of the domain's width
thermal-humidity = 85, 98        ; %; higher: lower cloud base
;thermal-seconds = 600, 1200     ; s
patch-meters = 150, 600          ; size of the warm patches (m)
burst-seconds = 30, 120          ; how often the patches change (s)

; The air: how unstable, how wet, where the cap is
;ground-temperature = 15, 28     ; C
lapse-low = 8.5, 9.8             ; C per km below the base (9.8: neutral)
lapse-high = 5.5, 7.5            ; C per km above it (lower: towers)
cap-height = 1000, 2500          ; m
cap-lapse = -3, 2                ; C per km above the cap (negative: hard cap)
humidity-low = 65, 85            ; % at the ground
humidity-high = 40, 70           ; % at the top (dry: ragged edges)

; Wind and turbulence
shear = 0, 3                     ; m/s per km
vorticity = 0, 0.08              ; 0.15 already eats the cloud

; The domain and the run (fixed here)
;cell-meters = 15                ; m, at grid 128
height-ratio = 0.75, 1.25        ; height of the domain, of its width
;sponge = 12.5                   ; % at the top
seconds = 1100                   ; s
;seed = 42                       ; fixed: the same thermals every run
