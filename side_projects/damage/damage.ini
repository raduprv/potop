; The damage model's numbers (see DESIGN.md and damage_model.h). The
; scenes built on the model read this file every time they start: change
; a number, press R in damage_view and throw the ball again.
;
; Impulses are in newton seconds: a mass times the speed it loses. The
; ball below at 16 m/s stopped dead by a wall gives about 4000.
; Forces are in newtons: a kilogram weighs about ten. A log of the cabin
; weighs some 1500, a brick 950.

[model]
; A hit piece shares the impulse among its links; each link passes this
; much of what it got to the piece at its other end, which shares it again
hop_falloff = 0.5
; Contacts slower than this (meters a second) are not hits
hit_speed = 1.0
; A loose group of fewer pieces than this is rubble: it stays glued as it
; is and takes no more damage
rubble_pieces = 3
; What breaks links goes on with this much of its speed instead of
; bouncing off (0: stops dead, 1: goes through as if nothing was there)
breakthrough_speed_kept = 0.85
; A blast: full strength within the radius, fading to nothing over the
; falloff beyond it (meters)
blast_radius = 1.5
blast_falloff = 3.0
; A link loaded to just what it bears lasts this long (seconds) from
; whole; loaded to twice that, half as long. What hits have hurt goes
; sooner. This is the moment a building stands before it gives way.
collapse_seconds = 1.5
; Collision shapes are this much smaller than the pieces, all round
; (meters): the play a piece needs to come out from among the others
shape_gap = 0.003

; The ball thrown with the left mouse button
[ball]
radius = 0.2
density = 7800

; Materials. density: kilograms a cubic meter. crush: the load (newtons)
; a piece bears before it is crushed and lets go of everything.
[wood]
density = 600
crush = 300000

[brick]
density = 1800
crush = 500000

[glass]
density = 2500
crush = 9000

; Links.
; Against hits: threshold: a share of an impulse under this does nothing
; to the link. hit_points: how much over the threshold it takes, in all,
; before it breaks.
; Standing still, what it bears (newtons): compression: pressed together
; (what rests on it). pull: pulled apart (what hangs from it), or held
; from the side. cantilever (newton meters): a weight times how far to
; the side of the link it is, when nothing else holds it.

; Wood to wood
[nails]
threshold = 150
hit_points = 600
compression = 200000
pull = 4000
cantilever = 2500

; Brick to brick
[mortar]
threshold = 60
hit_points = 200
compression = 500000
pull = 3000
cantilever = 900

; Anything to the ground
[foundation]
threshold = 300
hit_points = 1500
compression = 1000000
pull = 5000
cantilever = 5000

; A pane to what frames it
[glazing]
threshold = 30
hit_points = 60
compression = 100000
pull = 500
cantilever = 200
