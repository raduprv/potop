; Potop layouts: groups of objects placed together (homesteads, camps, ...).
;
; One section per layout. Its parts are placed in the layout's own frame:
; +z is its front (where the house door looks), +x its right, in meters.
; New maps get layouts where the ground suits them; the layout tool (L)
; places them wherever you click, and Delete removes the one nearest the
; cursor (with everything it placed).
;
; Layout keys
;   footprint_meters = 10        radius: levelled ground, distance to other layouts
;   flatten = false              level the ground under the footprint first
;   orient = random              random | downhill (front down the slope, towards
;                                the valley) | water (front towards the nearest water)
;   spawn_per_square_kilometer = 0     how many a new map gets (0 = only by hand)
;   spawn_soils = all            soils the center may stand on
;   flatness_meters = 3          largest height difference over the footprint
;   spawn_height_minimum = 0     fractions of the map's highest point
;   spawn_height_maximum = 1
;   spacing_meters = 20          free room between it and other layouts
;   water_search_meters = 40     how far shore and water parts look for water
;   needs_water = false          new maps only put it where water is in reach
;
; Parts: part.N = single | ring | scatter | rows | fence | stack, then part.N.key = value
;   models = a:2, b:1            object types (from objects.ini), picked by weight
;   layout = name                instead of models: a whole other layout
;                                (single, ring and scatter parts)
;   offset_meters = x, z         where the part sits in the frame
;   yaw_degrees = 0              extra turn of each item
;   facing = front               front: the layout's front (default for single and
;                                fence); center: towards the part's center (ring
;                                default); outward; along: along the circle;
;                                random (scatter and rows default)
;   chance = 1                   probability the whole part is there
;   item_chance = 1              probability of each item (gaps in rings, fences, rows)
;   count = min, max             number of items (ring, scatter), or of the
;                                pieces piled up (stack)
;   radius_meters = min, max     ring radius, or scatter area (one value: a disk)
;   size_meters = x, z           rows and fence rectangle
;   row_spacing_meters = 1       rows: distance between rows (along z)
;   plant_spacing_meters = 0.6   rows: distance between plants in a row (along x)
;   jitter_meters = 0            rows: random shift of each plant
;   same_model_per_row = false   rows: one crop per row
;   gate_side = none             fence: front | back | left | right | none
;   gate_width_meters = 2.5
;   lift_meters = min, max       height above the ground (a ball on its stand)
;   scale = min, max             instead of the type's own size range
;   place = ground               ground | shore: where the water starts in front of
;                                the layout, plus the offset | water: the same
;                                (for floating things)
;   supports = name              stack: an object type laid across both ends of the
;                                pile, under it (logs on two logs)
; A stack piles copies of one model (picked once) at the offset, turned by
; yaw_degrees, each on top of the one below. They are loose things: the
; pile stands until the water or a hit topples it.

[log_pile]
footprint_meters = 3
part.1 = stack
part.1.models = log2
part.1.count = 5
part.1.supports = log2
part.1.scale = 1

[crate_stack]
