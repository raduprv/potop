; What a projectile hitting something shows (src/projectiles.h). One section
; per kind of hit; the first that fits is taken. Comments go on lines of
; their own.
;
; effect             particles.ini (bursts: played where it hit, thrown off the surface)
; spray              meters a second its particles get off the surface, along its normal
; materials          the ground's materials (grass, dirt, rock, sand, clay, snow, silt,
;                    needles, leaves, trampled)
; categories         the objects' categories (objects.ini)
; water              true: going into the water
; actors             true: an actor's body
; fallback_ground    true: the ground's materials no section lists
; fallback_object    true: the objects' categories no section lists
; decal              the mark it leaves (data/decals.ini; none if not given)
; decal_size         its size, meters across (the decal's own if not given)

[water]
effect = impact_water
spray = 3
water = true

[flesh]
effect = impact_flesh
spray = 1.5
actors = true

[rock]
effect = impact_rock
spray = 3
materials = rock
categories = rocks, ruins, structures, buildings
decal = bullet_stone

[dirt]
effect = impact_dirt
spray = 2.5
materials = dirt, clay, silt, grass, needles, leaves, trampled, sand, snow
fallback_ground = true
decal = bullet_dirt

[wood]
effect = impact_wood
spray = 2.5
categories = trees, dead wood, bushes, fences, boats, goods, village, farm, camp, fishing, cacti, crops, flowers, grass, water plants
fallback_object = true
decal = bullet_wood
