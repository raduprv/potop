; How each soil behaves. materials.ini says what the ground looks like, this
; file says what it does. Removing a key restores the default compiled into
; src/soils.c.
;
; These are game values, tuned to look right at game speed; real soils absorb
; water one to two orders of magnitude slower.

[general]
; how much sediment flowing water can carry:
; capacity (meters of material per cell) = transport_capacity * depth * (speed - critical speed)
transport_capacity = 0.05
; fraction of the excess sediment that settles per second where water slows down
deposition_rate = 0.6
; wet soil starts eroding at this fraction of its critical speed
wet_critical_speed_factor = 0.6
; soil moisture drains away at this rate where no water stands on it
drying_millimeters_per_second = 0.1
; deposited silt starts showing at this thickness and covers the ground fully at silt_full_millimeters
silt_visible_millimeters = 3
silt_full_millimeters = 40
; erosion stops this close to the bedrock
minimum_soil_millimeters = 1
; generated soil depth over the bedrock: deep in flat valleys, thin on steep slopes and peaks
soil_depth_minimum_meters = 0.3
soil_depth_maximum_meters = 4
; under water, a cell sticking out above (or dipping below) both its
; neighbors on a line, the sawtooth erosion leaves under cliffs, gives this
; fraction of the difference to them (or takes it) at every bank check;
; moves only loose material, never bedrock; 0 disables
erosion_smoothing = 0.5

; Per soil:
;   infiltration_millimeters_per_second  how fast dry soil drinks standing water
;   capacity_millimeters                 water it holds before it is saturated
;   friction_factor                      multiplies the water's bed friction
;   critical_speed_meters_per_second     flow slower than this does not erode
;   erodibility                          how fast it erodes above that speed
;   wet_talus_slope                      steepest slope (meters per meter) it holds under water

[sand]
infiltration_millimeters_per_second = 2
capacity_millimeters = 60
friction_factor = 1.0
critical_speed_meters_per_second = 0.25
erodibility = 0.8
wet_talus_slope = 0.6

[earth]
infiltration_millimeters_per_second = 0.5
capacity_millimeters = 80
friction_factor = 1.3
critical_speed_meters_per_second = 0.45
erodibility = 0.4
wet_talus_slope = 0.8

[clay]
infiltration_millimeters_per_second = 0.05
capacity_millimeters = 100
friction_factor = 1.1
critical_speed_meters_per_second = 0.8
erodibility = 0.2
wet_talus_slope = 1.0

[rock]
infiltration_millimeters_per_second = 0
capacity_millimeters = 0
friction_factor = 0.8
critical_speed_meters_per_second = 100
erodibility = 0
wet_talus_slope = 100

[silt]
infiltration_millimeters_per_second = 0.2
capacity_millimeters = 80
friction_factor = 0.9
critical_speed_meters_per_second = 0.2
erodibility = 1.0
wet_talus_slope = 0.4
