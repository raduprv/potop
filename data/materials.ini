; Terrain surface materials.
;
; textures       up to 3 variants, mixed by low frequency noise to hide
;                repetition. For a name like "grass_01" the game loads
;                data/textures/grass_01.png (also .jpg / .bmp) and, if present,
;                data/textures/grass_01_normal.png as its normal map (green up
;                the picture, OpenGL's; normal_green_down = 1 for DirectX's).
;                Without one the normals come from grass_01_height.png, or
;                else from the brightness.
; tiling_meters  how many meters one repeat of the texture covers
; macro_tiling_meters  the same, for the large scale seen from afar
;
; Where two materials meet, each breaks into patches of the other instead of
; fading into it (procedural, nothing repeats):
; patch_meters   how big its patches (meters)
; patch_edge     how soft their edges (meters; 0.03)
; patch_strength how far they break the border (0: a plain blend; 0.6)
;
; fallback_*     procedural stand-in used when no texture file is found
;
; Textures may be any size; they are resampled to [render] texture_size.
; Leave "textures" commented out to use the fallback.

[needles]
textures = needles_01
macro_tiling_meters = 4
tiling_meters = 4
patch_meters = 4
patch_edge = 0.05
patch_strength = 0.6
fallback_dark = 48, 74, 30
fallback_light = 104, 134, 58
fallback_period = 16

