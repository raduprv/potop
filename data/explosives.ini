; What blows up (engine/explosives.h). One section per kind; an item of
; items.ini is a grenade of a kind with "explosive = name". Comments go on
; lines of their own.
;
; fuse                 timer (goes off fuse_seconds after it is thrown),
;                      proximity (armed after arm_seconds, goes off when an
;                      actor or the player comes within trigger_meters),
;                      impact (armed after arm_seconds, goes off where it
;                      strikes something: its speed changing by impact_speed
;                      at once) or none (never: a ball shot, whose damage, of
;                      its damage_type, goes to an actor it strikes, as the
;                      blow goes against its throw speed)
; impact_speed         meters a second its speed must change by at once for
;                      it to have struck something (4)
; life_seconds         fuse none: taken off the map after this (0: never)
; trail_effect         particles.ini: follows it while it flies
; kilograms            of explosive, for the breakable buildings (wrecks.h:
;                      its wave and gas on their pieces; 0: nothing to them)
; radius_meters        what the blast reaches: its damage and push fade out to here
; damage               at its heart (what it does is the game's; behind
;                      something, a third of it)
; push                 the blast's impulse, pascal seconds (newton seconds on a
;                      square meter facing it) a meter away: it falls as the
;                      distance grows, gone at the radius; a thing gets it
;                      times the face it shows (a crate a lot, a pebble
;                      little) and moves by its weight. A hand grenade: about
;                      100..200; no faster than 25 m/s however light
; crater_meters        the hole it digs if it goes off near the ground (0: none);
;                      crater_depth_meters
; effect               particles.ini (up to 4 lines: fire, smoke, dirt...)
; light                r, g, b: its flash; light_intensity, light_radius,
;                      light_seconds (how long it fades)
; throw_speed          meters a second, thrown
; model, size          what it looks like in the air and on the ground: an
;                      objects.ini type with a body, made size meters across
; mass                 kilograms (the model's own, made small, would be a
;                      matchbox's: a shot would send it off the map)
; damage_type          what its hits say: ballistic, explosive (default),
;                      fire, cold, poison, magic (what each does is the game's)
; burn_seconds         a fire left burning where it went off (0: none):
;                      burn_radius_meters, burn_damage_per_second (its hits
;                      every half second, of its damage_type), burn_effect
;                      (particles.ini, campfire by default)
; buried               a mine: put down mostly under the ground (true/false)
; pressure             a mine: only a walker stepping near sets it off (not a
;                      bird), one at least trigger_height_meters tall
; spares_owner         a mine: not set off by who put it down
; noise_meters         heard this far (the animals: 600)

[frag]
kilograms = 0.3
fuse = timer
fuse_seconds = 4
radius_meters = 9
damage = 220
push = 150
crater_meters = 1.4
crater_depth_meters = 0.5
effect = explosion_fire
effect = explosion_smoke
effect = explosion_dirt
light = 1.0, 0.7, 0.35
light_intensity = 40
light_radius = 35
light_seconds = 0.4
throw_speed = 14
model = crate
