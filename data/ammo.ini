; What the weapons fire (src/weapons.h, projectiles.h). One section per
; kind of ammo. Comments go on lines of their own.
;
; muzzle_velocity    meters a second as it leaves the barrel
; mass_grams         the bullet's (what it gives what it hits)
; drag               1 / meters: the air slows it by drag * speed squared (a
;                    7.62x39 loses about 40% of its speed over 300 m); in the
;                    water hundreds of times more
; damage             at the muzzle; it goes with the energy left (the game
;                    decides what it does)
; damage_type        what its hits say: ballistic (default), explosive, fire,
;                    cold, poison, magic (what each does is the game's)
; pellets            shot at once (a shotgun); pellet_spread_degrees round the aim
; push               of its momentum, what a loose body it hits gets (1: as
;                    physics has it; more: livelier)
; life_seconds       gone after, if it hit nothing
; throws             not a bullet: a thing of explosives.ini thrown out of the
;                    barrel at its throw_speed (a launcher's grenade, a ball),
;                    the physics flying it; the keys above then do nothing

[7.62x39]
muzzle_velocity = 715
mass_grams = 7.9
drag = 0.0011
damage = 35
pellets = 1
push = 6
life_seconds = 4

[7.62x54R]
muzzle_velocity = 830
mass_grams = 9.6
drag = 0.0008
damage = 70
pellets = 1
push = 7
life_seconds = 5

; A spell's for now: where it hits, the game pours water (game.c)
[water_bolt]
muzzle_velocity = 300
mass_grams = 20
drag = 0.0004
damage = 5
pellets = 1
push = 2
life_seconds = 6


; The grenade launcher's: a grenade going off where it strikes
; (explosives.ini's launcher_grenade)
[40mm_grenade]
throws = launcher_grenade

; The ball gun's: a heavy ball, blunt (explosives.ini's ball)
[ball]
throws = ball
