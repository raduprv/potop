; Potop actors: animated creatures. One section per actor type, named after
; the type. Models are .pact files in data/actors/, made from other formats
; with tools/potop_convert (see README.md, "Actors").
;
;   model = name                 data/actors/name.pact (default: the section name)
;   scale = 1                    multiplies the model's size
;   front_degrees = 0            where the model's head points: 0 = +Z, 90 = +X
;   idle_action = idle           what it does when nothing else: played when
;                                placed, and after an action that plays once
;   blend_seconds = 0.25         crossfade between actions
;   ground_align = 1             how much it leans with the slope under its feet:
;                                1 lies along it (four legged animals), 0 stays
;                                upright (people), on its lowest foot
;   walk_action = walk           the action it walks (and swims) with
;   walk_meters_per_second = 1.5
;   walk_cycle_meters = 0        ground covered by one loop of the walk, so the
;                                feet do not slide; 0: the walk as it is at
;                                walking speed
;   run_meters_per_second = 4    when the game makes it run (a charge, a flight)
;   turn_degrees_per_second = 180
;   maximum_slope_degrees = 40   steeper it does not climb
;   vision_meters = 20           how far ahead on its path it notices changes
;   sight_meters = 40            how far it sees someone standing in full light
;                                (less in the dark, less someone crawling)
;   sight_degrees = 220          how wide it looks (360: behind it too)
;   path_groups = 1              bits: the areas that block one of them block
;                                its paths (a locked gate)
;   can_swim = true              false: deep water is a wall
;   swim_meters_per_second = 1   a current faster than this is a wall too
;   wade_depth_meters = 0.3      deeper water slows it
;   swim_depth_meters = 0.8      deeper water lifts it: it swims, its body this
;                                deep under the surface
;   height_meters = 0            the room it needs to pass under something (a
;                                bridge); 0: its model's height
;   width_meters = 0             across its flanks: straight stretches of its path
;                                keep half that from stones and trunks; 0: its
;                                model's width
;   step_meters = 0.4            how high it steps up from one meter to the next,
;                                however steep (onto a bridge, a dock)
;   ik = true                    feet on objects: the legs bend so a foot on a
;                                deck or a boulder stands on it (not on the
;                                terrain, not for flyers)
;   ik_feet =                    the foot bones, comma separated; empty: every
;                                bone whose name starts with foot (two bones
;                                above each bend: thigh and calf)
;
; Flyers (birds): walk_action is the flight, idle_action what it does on the
; ground; they fly over everything under their ceiling and around the rest,
; circle over their goal, or land near it when there is no room to circle
;   flies = false
;   fly_meters_per_second = 12
;   fly_height_minimum_meters = 15  above the ground: the lowest it cruises; it
;   fly_height_maximum_meters = 60  picks a height in between every few seconds
;                                and circles within the maximum of the goal
;   fly_ceiling_meters = 150     above the higher of where it starts and where
;                                it goes: what rises higher, it flies around
;   circle_radius_meters = 12    round its goal
;   climb_meters_per_second = 4  it dives twice as fast
;   glide_action = glide         played going down; none of that name: it flaps
;
; K places a type under the cursor (ctrl + K picks which), shift + K
; removes the nearest;
; J / shift + J switch every actor to the next / previous action; a left click
; selects an actor, the next ones send it there, escape lets go.

[bear]
model = bear
walk_meters_per_second = 0.77
walk_cycle_meters = 0.98
run_meters_per_second = 3.36
turn_degrees_per_second = 60
sight_meters = 40
sight_degrees = 220

; From Eternal Lands' falcon (bird_falcon.xml, with bird_fly2.caf added as
; glide and bird_idle1.caf as hover). No animation for sitting yet: on the
; ground it plays its fight idle
[falcon]
model = falcon
flies = true
idle_action = combat_idle
walk_action = walk
glide_action = glide
turn_degrees_per_second = 120
ground_align = 0

; A hen (glTF from Fable, Nov 2026: walk, eat, idle; no flap, its wings
; are part of the body). Upright, small, slow; game/hens.c keeps them round
; their hen house (its spots: the yard, the feeders, the holes)
[hen]
model = hen
idle_action = idle
walk_action = walk
walk_meters_per_second = 0.25
walk_cycle_meters = 0.183
run_meters_per_second = 1.5
turn_degrees_per_second = 120
ground_align = 0
step_meters = 0.2
maximum_slope_degrees = 45
sight_meters = 12
can_swim = false
ik = false

; A cow (glTF from Fable, Nov 2026: idle, idle_break, walk, run, eat,
; lie_down, sleep_idle, get_up, pain, die), made a grown cow's size (the
; model is a small one: 0.93 m tall, 2 m long); game/animals.c keeps them
; round their cow farm (its spots: the yard, the hay rack, the trough, the
; byre's way in and its stalls)
[cow]
model = cow
scale = 1
idle_action = idle
walk_action = walk
walk_meters_per_second = 0.86
walk_cycle_meters = 1.03
run_meters_per_second = 3.26
turn_degrees_per_second = 30
turn_walk_fraction = 0.5
ground_align = 1
step_meters = 0.3
maximum_slope_degrees = 35
sight_meters = 25
can_swim = false
ik = false

