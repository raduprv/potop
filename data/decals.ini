; Decals: marks laid on things (src/decals.h). One section per kind; the
; projectiles' hits name them (impacts.ini, decal), explosions leave a
; "scorch". Comments go on lines of their own.
;
; cell               its picture: a cell of the atlas (4 x 4, numbered left to
;                    right, top to bottom; decals_color.png and decals_normal.png
;                    in props/textures, 512 x 512, else stand-ins drawn by the game)
; cells              that many cells from there, one picked at random (1)
; size_meters        across (0.1)
; depth_meters       how far into and out of the surface it reaches (0.05)
; opacity            0..1 (1)
; relief             how much its normal map counts, 0..2 (1)
; roughness_weight   how much its roughness replaces the surface's, 0..1 (0.5)
; life_seconds       gone after this long (0: until newer ones push it out)
; fade_seconds       fading out at the end of its life (2)
;
; The stand-ins' cells: 0 a hole in wood, 1 and 2 holes in stone, 3 a hit in
; the dirt, 4 a scorch, 5 a splash of mud, 6 a damp stain, 7 soot

[bullet_wood]
cell = 0
size_meters = 0.09
depth_meters = 0.04
relief = 1.2
roughness_weight = 0.6

[bullet_stone]
cell = 1
cells = 2
size_meters = 0.11
depth_meters = 0.04
relief = 1.2
roughness_weight = 0.6

[bullet_dirt]
cell = 3
size_meters = 0.16
depth_meters = 0.1
relief = 0.8
roughness_weight = 0.4
life_seconds = 120
fade_seconds = 20

[scorch]
cell = 4
size_meters = 3
depth_meters = 1
relief = 0.3
roughness_weight = 0.8
life_seconds = 600
fade_seconds = 60

[mud]
cell = 5
size_meters = 0.6
depth_meters = 0.15
relief = 0.6
roughness_weight = 0.8

[damp]
cell = 6
size_meters = 1.2
depth_meters = 0.2
relief = 0
roughness_weight = 1

[soot]
cell = 7
size_meters = 1.5
depth_meters = 0.3
relief = 0
roughness_weight = 0.7
