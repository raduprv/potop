; Particle effects (see src/particles.h). One section per effect; the game
; plays them by name, the Effects tool (Debug) puts them on actors, objects
; or the ground. "Reload ini" in the tool reads this file again while the
; game runs. Comments go on lines of their own.
;
; texture            dot, spark, star, ring, smoke (4 frames), flame (8 frames)
; frames_per_second  0: the frames play once over a particle's life
; blend              additive (glows, adds to what is behind) or alpha (lit, covers)
; intensity          a glowing one's colors times this, past white (what the
;                    bloom catches: a fire's heart); 1
; distortion         its texture bent by a rising noise, a share of its size
;                    (a flame's licking: 0.1 .. 0.2); 0: none
; soft               meters: fades out that close in front of what is behind
;                    it (no hard line where a flame goes into a log); 0: none
; emit               continuous (rate a second, until stopped) or burst
;                    (count over duration seconds, then done; 0: all at once)
; shape              point, sphere, disc, ring, box, outline (the sides of
;                    the box of what it is on: around a house)
; shape_radius       meters (sphere, disc, ring; box/outline at a point);
;                    0: the size of what it is on
; life, speed        seconds, meters a second: "a" or "minimum, maximum"
; direction          x, y, z (normalized); spread_degrees around it (180: every way)
; outward            meters a second away from the middle, flat, on top
; gravity            meters a second squared, down; negative rises
; drag               1 / seconds (how fast the air slows it)
; turbulence         meters a second squared of swirling; turbulence_scale:
;                    meters, the size of the swirls
; spin               radians a second, "minimum, maximum"
; random_turn        true: born turned any way; false: upright (flames)
; stretch            > 0: drawn long along its motion, that many seconds of it (sparks)
; collide            none, die (at the ground or the water), bounce, slide
;                    (along them: down a slope, over the water); bounce: the
;                    share of the speed it keeps (slide: its friction, 1 / seconds)
; color              stops over its life, "|" between them: "time r g b a",
;                    time 0 (born) .. 1 (gone), colors 0..255 (up to 4 stops)
; size               stops the same way: "time meters"
; light              r, g, b (0..1, as the eye sees it): the effect gives light
;                    (fires, sparks, magic), coming up as it starts and, a
;                    burst, dying with its particles
; light_intensity    how bright (1: about the noon sun a meter away); light_radius:
;                    meters it reaches (6); light_flicker 0 steady .. 1 dancing;
;                    light_height: meters above the emitter
;                    flash: seconds a burst, seconds a flash, flashes a burst, how
;                    together (1 all at once .. 0 each its own): it shows only in
;                    its flashes (fireflies)

