; Potop settings. Everything here overrides the compiled-in defaults
; (see src/settings.c). Remove a line to get the default back.
; Colors are "r, g, b" with components 0..255.

[terrain]
; cells per side, rounded up to a multiple of 64; one cell is one meter
size = 4096
cell_size_meters = 1.0
; 0 = random seed at every start
seed = 240
max_height_meters = 280
; large features (hills, valleys) across the whole map
feature_count = 3
; smallest noise wavelength in meters (sets the number of octaves)
minimum_feature_meters = 8
; amplitude ratio between octaves: lower is smoother
persistence = 0.45
; domain warp strength, as a fraction of the feature size
warp_amount = 0.35
; 0 = only rolling hills, 1 = strong ridged mountains
mountain_amount = 0.7
; fraction of the map that has mountains
mountain_coverage = 0.45
; thermal erosion: slopes steeper than talus_slope (meters per meter) slide
thermal_iterations = 60
talus_slope = 0.8
; soil classification
rock_slope = 0.85
rock_height_fraction = 0.78
sand_height_fraction = 0.04
clay_height_fraction = 0.15

[camera]
field_of_view_degrees = 32
minimum_pitch_degrees = 0
maximum_pitch_degrees = 80
default_pitch_degrees = 45
minimum_distance_meters = 20
maximum_distance_meters = 2500
rotate_degrees_per_pixel = 0.3
; screen heights per second
keyboard_pan_speed = 0.6
zoom_step_factor = 1.15

[render]
vsync = false
moss_shells = 8
moss_shell_meters = 0.02
moss_shell_distance_meters = 12
sky_color = 158, 189, 219
; fog uses exp(-(distance * density)^2)
fog_density = 0.00004
; azimuth 0 = sun towards +X, 90 = towards +Z
sun_azimuth_degrees = 60
sun_elevation_degrees = 38
sun_color = 255, 242, 217
sun_intensity = 1.0
ambient_intensity = 0.35
; every terrain texture is resampled to this size
texture_size = 2048
anisotropy = 8
; strength of the relief derived from texture height maps
normal_strength = 2.0
; softness of the height based blend between materials (0.05 sharp .. 0.5 soft)
height_blend_depth = 0.35
; snow line as a fraction of max height, and how much lower it sits on shady slopes
snow_height_fraction = 0.82
snow_aspect_shift = 0.12
; Terrain level of detail: chunks farther than this are drawn with every
; second vertex, twice as far with every fourth, and so on (down to every
; 32nd). Never lower than 2.5 chunk diagonals (about 57 m at 0.25 m cells).
; 0 draws everything at full detail.
lod_distance_meters = 80
; Fraction of the window resolution the 3D scene is rendered at, then
; scaled up; 0.75 shades about half as many pixels. 1 = full resolution.
render_scale = 1.0

; lățimea tranziției dintre tipurile de sol
soil_blend_meters = 4
; panta pentru alegerea materialelor e măsurată pe distanța asta
material_normal_meters = 1.5
; pantă 0 = plat, 1 = vertical
grass_slope_start = 0.18
grass_slope_end = 0.45
cliff_slope_start = 0.42
cliff_slope_end = 0.75


variation_tiling_meters = 180
variation_strength = 0.35
variation_hue_strength = 0.25

; 0 = cer senin, 1 = înnorat
cloud_coverage = 0.45
cloud_softness = 0.16
; 0 = fără umbre de nori
cloud_shadow_strength = 0.65
cloud_tiling_meters = 900
cloud_height_meters = 500
; direcția în care merg norii: 0 = +X, 90 = +Z
wind_direction_degrees = 30
wind_speed_meters_per_second = 6

shadow_update_interval_seconds = 0.5
;foam_speed_meters_per_second = 1000

; erosion changes the ground a little at a time; the shadows are redrawn
; once it has changed by this much somewhere
shadow_erosion_meters = 0.15
sky_occlusion_directions_per_frame = 1

[tools]
brush_radius_meters = 12
brush_minimum_radius_meters = 2
brush_maximum_radius_meters = 80
raise_meters_per_second = 6
smooth_strength_per_second = 3
; height (or depth) of terrain stamps, changed in game with - and =
stamp_height_meters = 4

[simulation]
steps_per_second = 30
maximum_steps_per_frame = 16
diagnostics_interval_seconds = 30
; the simulation stops for the frame once it has used this much time; the
; game then runs slower instead of falling further and further behind
maximum_milliseconds_per_frame = 25
pause_in_background = true
background_frames_per_second = 10
threads = 4

[water]
sleep_speed_meters_per_second = 0.5
sleep_change_millimeters_per_second = 4
film_millimeters = 1
film_evaporation_millimeters_per_second = 0.02
meniscus_millimeters = 3
depth_scaled_pipes = true
; water flowing into a sleeping tile wakes it only if a border cell gets at
; least this much in one substep; smaller trickles are held back at the border
; (the level difference grows until they get through)
border_wake_millimeters = 0.15

; pipes are sized by the water depth only up to this depth: thinner films
   ; flow slowly, deeper water behaves as with classic pipes (0 = classic)
pipe_depth_limit_meters = 0.02

; Water up to this deep drains fast (game, not hydrology); 0 turns it all off
thin_water_millimeters = 30
; Thin water flows without the extra friction of shallow water
thin_water_superfluid = true
; Thin water also jumps to its lowest neighbor once a step, even in still tiles
thin_water_shortcut = true
; Thin water soaks into the ground this many times faster
thin_water_infiltration_factor = 4
; Mud in water slower than this settles out, at this fraction per second
still_water_speed_meters_per_second = 0.55
still_water_deposition_per_second = 3

; Thin water left behind (in still tiles, no deeper neighbor) dries this fast; not while it rains
thin_water_evaporation_millimeters_per_second = 1
; Water at rest only starts flowing for at least this much level difference (0: off)
still_level_millimeters = 5
; Slow water shallower than this is braked harder near the shore, so waves die on the beach
shore_damping_depth_meters = 0.2
shore_damping_per_second = 2

sleep_after_substeps = 10
; Water pouring into a cell of a sleeping tile faster than this wakes it; slower is thrown away
asleep_wake_millimeters_per_second = 130
; A neighbor's level this far below a sleeping tile's wakes it (a breaking dam)
asleep_level_wake_millimeters = 120

[physics]
; Objects take part in the physics (bodies, floating, floods)
enabled = true
; Threads of the physics engine (it has its own; the water uses the rest)
threads = 2
; Physics substeps per simulation step: more is steadier, and slower
substeps = 4
; How hard flowing water pushes things: drag = 1/2 * water density * this * area * speed^2
drag_coefficient = 1.0
; A hit's impulse is spread over this long; shorter hits tear trees loose sooner
hit_seconds = 0.1
; Water flowing at least this fast wakes the sleeping objects in it
wake_flow_meters_per_second = 0.15
; The physics' copy of the ground follows erosion only where it changed more than this
terrain_resync_meters = 0.3
terrain_check_seconds = 2
; Grass and such react to the water this often
flood_check_seconds = 0.25
; Bobbing of floating bodies is braked this much per second
float_damping_per_second = 2
; Water shallower than this does not push bodies at all
water_minimum_meters = 0.03



