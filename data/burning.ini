; Objects on fire (engine/burning.h). The fire is a front growing through
; the object from where it was lit; each point of it caught when the front
; reached it, and from then on it chars, glows in its cracks, burns down
; to ash and crumbles away. The console's "burn" lights what the middle of
; the screen looks at ("burn clear" puts every fire out).

[wood]
; how fast the front goes through it (meters a second)
spread_meters_per_second = 0.05
; a point caught: charred black all through after this (seconds)
char_seconds = 25
; a point caught: its flames and embers out, gray ash, after this (seconds)
burn_seconds = 150
; then it crumbles away over this (seconds)
ash_seconds = 40
; the flames' sites along the object, this far apart (meters)
site_spacing_meters = 0.4
; particles.ini's effects
flame_effect = burning_flames
smoke_effect = burning_smoke
embers_effect = burning_embers
