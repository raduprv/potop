; The breakable buildings (engine/wreck.h, wrecks.h): the model's numbers
; (first written for side_projects/damage/damage.ini: every one explained
; there and below) and, in [looks], how each material is drawn. The [ball]
; and [blast] sections are the test bench's (its viewer's ball and bombs);
; in the game the weapons and explosives.ini's kilograms are.

[looks]
; textures (relative to data/) and how many meters one repeat covers
wood_albedo = textures/old_wood.png
wood_normal = textures/old_wood_normal.png
wood_orm = textures/old_wood_arm.png
wood_meters = 1.0
brick_albedo = textures/clay_01.png
brick_normal = textures/clay_01_normal.png
brick_meters = 0.5
; glass: no texture, a plain color
glass_meters = 1.0

[cuts]
; a cut piece is drawn at the nearest of this many parts of the whole
; piece it came from (6: a sixth, a third, a half, two thirds, five
; sixths), so the pieces share a few models; the physics keeps the exact size
steps = 6
; a cut piece shorter than this is not drawn at all
vanish_meters = 0.12

; The damage model's numbers (see DESIGN.md and damage_model.h). The
; scenes built on the model read this file every time they start: change
; a number, press R in damage_view and throw the ball again.
;
; Impulses are in newton seconds: a mass times the speed it loses. The
; ball below at 16 m/s stopped dead by a wall gives about 4000.
; Forces are in newtons: a kilogram weighs about ten. A log of the cabin
; weighs some 1500, a brick 950.

[model]
; A hit piece shares the impulse among its links; each link passes this
; much of what it got to the piece at its other end, which shares it again
hop_falloff = 0.5
; Contacts slower than this (meters a second) are not hits
hit_speed = 1.0
; A loose group of fewer pieces than this is rubble: it stays glued as it
; is and takes no more damage
rubble_pieces = 3
; What breaks links goes on with this much of its speed instead of
; bouncing off (0: stops dead, 1: goes through as if nothing was there)
breakthrough_speed_kept = 0.85
; A blast's wave. What a kilogram of explosive gives a square meter that
; faces it at 1 m, in newton seconds (350: Sadovsky's formula for TNT;
; a bomb of m kilograms gives this times m to the power 2/3). The power
; of the distance it falls off by (1: Sadovsky; 1.2: a fit to what
; walls facing pentolite charges got). No distance is too far. Nearer
; than the bomb is big the wave grows no more: the explosive's density
; (kilograms a cubic meter) says how big that is.
blast_impulse_per_kilogram = 350
blast_falloff_power = 1.0
blast_charge_density = 1600
; Of a blast's push, what a piece loses when another piece (or the
; ground) is between its middle and the blast. 0: nothing shields
; anything. 1: what is hidden gets nothing.
blast_shielding = 0.8
; Of what a link can take of a sudden push, the part that springs back
; and costs it nothing (so that small knocks do not wear a house down)
link_elastic = 0.1
; A blast is over before much can move, so a piece's own mass takes up
; part of its push before its links feel it: for each kilogram, as much
; as this many links would. 0: all of a blast's push on what stands goes
; through the links down to the ground (a whole wall goes at its base).
; More: heavy pieces shrug it off and the damage stays near the blast.
blast_inertia = 0.005
; A blast's push comes on what stands in this many parts. After each,
; the links that have borne more than they can break, and the next part
; is shared among what is left; a piece that comes loose is pushed only
; by the parts still to come. 1: all at once (a piece either stays and
; loses all of its push, or goes with all of it).
blast_slices = 8
; After a blast's wave, the gas the bomb turned into is still there and
; presses on everything round it until it finds a way out. Rays from
; the blast look for the ways out (a ray that ends on a standing piece
; is shut in; the ground does not count either way).
; blast_gas: how hard the gas presses when it has no way out at all, as
;   a part of the blast's strength (1: as much again as the wave). 0: no
;   gas, only the wave.
; blast_gas_venting: the gas presses by the shut-in part of the rays to
;   this power. 3: with a tenth of the ways open it presses 0.73 as
;   hard, with half open 0.13. In the open it does nothing.
; blast_gas_rush: how much more a piece gets when the rays next to its
;   own all got out (the gas rushes past the edge of a hole). 1: twice.
blast_gas = 0.5
blast_gas_venting = 3.0
blast_gas_rush = 1.0
; The air on loose pieces: newtons for each square meter of a piece that
; faces the way it goes, at 1 m/s; it grows with the speed squared.
; 0.7 is real air on a flat thing (half the air's 1.2 kg a cubic meter,
; times a drag coefficient of about 1.2). A blast pushes by area, so it
; throws a thin board at hundreds of meters a second; this is what
; stops it a few meters on. 0: no air.
air_drag = 0.7
; Water (if whoever uses the model has any: WreckingBall's, say).
; What is loose and in it is borne up by the weight of the water it
; takes the place of, so it floats or sinks by its material's density,
; and the water drags on it as the air does, as many times harder as it
; is denser than the air. Kilograms a cubic meter.
water_density = 1000
air_density = 1.2
; A link loaded to just what it bears lasts this long (seconds) from
; whole; loaded to twice that, half as long. What hits have hurt goes
; sooner. This is the moment a building stands before it gives way.
collapse_seconds = 1.5
; A piece this many times longer than it is thick or wide is long: it can
; bend and break across
long_ratio = 4.0
; No piece is cut into a part shorter than this (meters)
cut_min_length = 0.3
; A cut is moved at least this far (meters) past the edge of any piece
; linked to the one cut (a plank breaks at the edge of its support, not
; over it)
cut_clearance = 0.05
; How stiff a link is against its two pieces turning apart, as a length
; (meters): it resists as two springs this far apart would. Longer:
; links are more like clamps, and more of the weight goes through them
; as cantilevers instead of round by other ways.
joint_arm = 0.15
; Collision shapes are this much smaller than the pieces, all round
; (meters): the play a piece needs to come out from among the others
shape_gap = 0.003

; The ball thrown with the left mouse button
[ball]
radius = 0.2
density = 1000

; The bombs set off with X and Shift X: kilograms of explosive
[blast]
kilograms = 3
big_kilograms = 9

; Materials. density: kilograms a cubic meter. crush: the load (newtons)
; a piece bears before it is crushed and lets go of everything.
; threshold, hit_points: the piece itself against hits (newton seconds:
; a hit under the threshold does nothing, what is over it uses the hit
; points up)
; below (with no hit points left it is no more).
; bend, snap: a long piece against bending. Times its thickness squared
; times its width (meters), bend is the bending moment it bears standing
; still (newton meters: a weight times its distance) and snap what it
; bears from a hit (newton second meters). The cabin's logs: 0.027; the
; bend scene's planks: 0.0077.
; stretch: how far the material stretches before it breaks, as a share
; of its length. With bend it gives the energy a long piece stores bent
; to breaking (bend * stretch * its volume / 3, joules), which a long
; piece loose by itself is held against when it lands on something or
; something lands on it.
[wood]
density = 600
crush = 300000
threshold = 6000
hit_points = 12000
bend = 3000000
snap = 150000
stretch = 0.01

[brick]
density = 1800
crush = 500000
threshold = 5000
hit_points = 6000
bend = 200000
snap = 60000
stretch = 0.0003

[glass]
density = 2500
crush = 9000
threshold = 100
hit_points = 300
bend = 20000
snap = 3000
stretch = 0.001

; Links.
; Standing still, what it bears (newtons): compression: pressed together
; (what rests on it). pull: pulled apart (what hangs from it). slide:
; held from the side. cantilever (newton meters): a weight times how far
; to the side of the link it is, when nothing else holds it.
; Against sudden pushes (hits, blasts, the shock of a fall): give, how
; far it gives before it lets go (meters). What it bears times its give
; is the work it takes to break it, joules; a push of so many newton
; seconds between two pieces is the push squared over twice their
; reduced mass, in joules. So what breaks a link depends on how heavy
; the pieces it joins are: no thresholds, no hit points.

; Wood to wood. (Nails hold far less pulled straight out than across,
; and come out over a couple of centimeters.)
[nails]
compression = 200000
pull = 1000
slide = 4000
cantilever = 2500
give = 0.02

; Brick to brick
[mortar]
compression = 500000
pull = 3000
slide = 3000
cantilever = 900
give = 0.002

; Anything to the ground
[foundation]
compression = 1000000
pull = 5000
slide = 5000
cantilever = 5000
give = 0.01

; A pane to what frames it
[glazing]
compression = 100000
pull = 500
slide = 500
cantilever = 200
give = 0.002

; Wood lying in wood with no nails: a log in the notch of the one it
; crosses at a corner, or in the groove of the one under it. By itself
; it does not hold against being lifted out (pull), only against sliding
; out of its notch (slide); what presses on it holds it more:
; - grip: for every newton it is pressed with, how many more newtons it
;   bears from the side (and that, at joint_arm, more turning)
; So the top log of a wall comes out easily and the bottom one does not.
[notch]
compression = 200000
pull = 300
slide = 2500
cantilever = 300
give = 0.05
grip = 0.6
