; Items: what can be carried (src/items.h). One section per item; the game
; refers to them by the section's name. Comments go on lines of their own.
;
; name           shown
; description    a line about it
; category       misc, weapon, ammo, food, material, clothing, tool, quest,
;                money (the small sign before its name in the lists)
; weight         kilograms, one
; value          one (money's units)
; stack          at most this many in one row of a list (1: each its own)
; usable         true: it can be used (a double click in the inventory, or Use);
;                what that does is the game's (the testbed eats food)
; slot           the body's slot it is worn or held in ([slots] names)
; weapon         a section of weapons.ini: this item is that weapon
; ammo           a section of ammo.ini: one of this item is one round of it
; model          lying on the ground: an objects.ini type (else a sack, a
;                crate), until there are models of their own
; size           meters across, lying on the ground (the model made that big)
; explosive      a section of explosives.ini: this item is a grenade of it
;                (thrown: G for "grenade", H for "proximity_grenade" in the game)

[slots]
names = hands, head, body, legs, feet, back

