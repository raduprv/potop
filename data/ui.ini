; The user interface: font, size, colors and icons.
;
; What gets changed in the game (window positions, the interface tab of the
; settings) is kept in ui_state.ini in the preference directory, on top of
; this file; delete it to come back to the values here.

[ui]
; Any TrueType font, relative to data/
font = ui/fonts/DejaVuSans.ttf
; In interface units (points times the scale below)
font_size = 15
; The conversations' text, times font_size (a television across the room: 2
; or more)
dialog_text_scale = 1.6
; Size of the whole interface: 1.25 makes everything a quarter bigger
scale = 1.0
; How opaque the brush panel's background is while the pointer is
; elsewhere (it is fully opaque under the pointer); 0 leaves only the buttons
panel_opacity = 0.6
show_status_line = true
; Tool buttons that have an icon show their name next to it (false: the
; icon alone, the name in the tooltip). The icon bar shows icons alone.
icon_labels = true

[colors]
; red, green, blue[, alpha], 0..255. Any of Nuklear's style colors:
; text, window, header, border, button, button_hover, button_active, toggle,
; toggle_hover, toggle_cursor, select, select_active, slider, slider_cursor,
; slider_cursor_hover, slider_cursor_active, property, edit, edit_cursor,
; combo, chart, chart_color, chart_color_highlight, scrollbar,
; scrollbar_cursor, scrollbar_cursor_hover, scrollbar_cursor_active,
; tab_header, knob, knob_cursor, knob_cursor_hover, knob_cursor_active.
; select_active is the color of the selected tool.
text = 226, 229, 233
window = 31, 35, 41, 242
header = 43, 49, 57
button = 52, 59, 69
button_hover = 65, 74, 86
button_active = 74, 118, 168
select_active = 70, 116, 168
slider_cursor = 108, 163, 222

[icons]
; PNG images (relative to data/) for the buttons, any size: they are drawn
; at the button's height. A button whose icon is missing shows its name.
;
; Icon bar: settings, save, load, new_map, pause, play, slower, faster,
;           diagnostics, status
; Tools:    raise, dig, paint, smooth, stamp, water_add, sponge, spring,
;           plant, clear, object, layout, remove_layout, inspect
; Soils:    soil_sand, soil_earth, soil_clay, soil_rock
; Stamps:   stamp_<name> (stamp_crater, stamp_dam, stamp_hill,
;           stamp_channel, stamp_lake, stamp_plateau)
; Plants:   plant_<category from objects.ini> (plant_trees, plant_grass...)
; Villages: layout_<name from layouts.ini> (layout_homestead, layout_camp...)
;
; settings = ui/icons/settings.png
; raise = ui/icons/raise.png
