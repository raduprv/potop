; Potop objects: everything that can stand on the map.
;
; One section per object type, named after the type. A [defaults] section
; changes the starting values of the types that follow it (until the next
; [defaults]); every type starts from them and overrides what it lists.
;
; Looks
;   model = name                 data/objects/name.e3d (default: the section name)
;   category = name              groups types for the planting brush (G cycles
;                                the categories) and for clearing
;   scale = min, max             random size of each placed object
;   random_yaw = true            turned at random when placed
;   front_degrees = 0            where the model's front (door, opening) points:
;                                0 = +Z, 90 = +X; layouts turn it to face their front
;   draw_distance_meters = 400   fades out (dithered) over the last fifth of it;
;                                [objects] draw_distance_scale in settings.ini
;                                multiplies all of them
;   shadow = all                 all: both shadow maps; near: only the fine map
;                                around the camera's target (small things);
;                                none: no shadow
;   light = r, g, b              gives light (0..1 each, as the eye sees the
;                                color): torches, lanterns, candles
;   light_intensity = 1          how bright (1: about the noon sun on what is a
;                                meter away); light_radius = 6: meters it reaches
;   light_flicker = 0            0 steady .. 1 a dancing flame
;   light_height = -0.6          meters above the object's foot (times its size);
;                                below 0: that much of the model's height
;                                (-0.6: a lantern's glass; -0.95: a torch's top)
;   light_core = 0               meters: a small glow where the light is (a
;                                flame, a lantern's glass); the bloom halos it
;   light_switched = true        a lamp: lit at dusk and put out at dawn, or as
;                                the game says (console: lights on|off|auto);
;                                false: burns on (torches), drowned by day
;   footprint_meters = 0         radius (at size 1) nothing else solid grows in;
;                                0 = not solid (grass grows next to anything,
;                                but never out of a footprint)
;   grass_clear_meters = auto    the grass round it: how far out from where it
;                                meets the ground the blades thin away to
;                                nothing (meters); auto: 0 for solid things
;                                (physics static or body: the blades right up
;                                to where it meets the ground), none for the rest;
;                                none: the grass grows through it
;   sway = 0                     in the wind (the settings: Wind in the plants),
;                                how far its top leans in a gale (meters at
;                                size 1); the higher up, the more (the foot
;                                stays); 0: still. Each [defaults] starts at 0
;   flutter = 0                  how much its leaves (cut out materials) shake
;                                in the wind (meters)
;   impostor = true              far away (smaller on screen than [objects]
;                                impostor_pixels in settings.ini, 64),
;                                drawn as a picture of itself, if its model is
;                                worth one (150 triangles or more, 1 m or more
;                                across); false: always the model
;   floats = false               rides the water surface (lily pads); for
;                                objects without a body (physics none or flood),
;                                bodies float by their density
;
; Physics: how the object takes part in the world
;   physics = none               none: only drawn (candles, cobwebs)
;                                flood: no body, but the water acts on it (see
;                                  flood below): grass, flowers, crops
;                                static: a solid body that never moves: things
;                                  bump into it (houses, walls, docks)
;                                body: a solid body that moves; with an anchor
;                                  it stands still until the water or a hit
;                                  pulls harder than the anchor (trees)
;   mass_kilograms = 0           at size 1 (grows with the size cubed); 0: the
;                                collision shape's volume times the density
;   density_kilograms_per_cubic_meter = 1000    below 1000 it floats: the
;                                volume that displaces water is mass / density
;   anchor_newtons = 0           how hard it must be pulled to come loose (at
;                                size 1, grows with the size squared); 0 = loose
;   falls_when_uprooted = false  trees tip over when they come loose
;   shape = auto                 collision shape: auto, sphere, capsule, hull,
;                                mesh (mesh: the model itself, static only).
;                                auto: a capsule for long things (logs, trees,
;                                boats), a convex hull of the model otherwise
;   navigation = auto           what it is to those that walk. auto: a wall
;                                (in the map of where they can go) if it is
;                                part of a module or its footprint's longest
;                                reach is over [simulation] navigation_wall_meters
;                                (1.2 m); else a small thing gone round (a
;                                trunk, a boulder), or a soft one if it is
;                                a body lighter than navigation_soft_kilograms
;                                (20 kg: a bucket; gone round at a walk, run
;                                through). wall, round, soft: that, whatever
;                                its size
;   blocks_water = default       the water flows around it (a wall for the
;                                water simulation); default: true for static,
;                                false for the rest
; Flood (physics = flood)
;   flood = stay                 stay: nothing happens; flatten: lies down in
;                                the direction of the flow; destroy: gone
;   flood_speed_meters_per_second = 1   flow that flattens or destroys it
;   flood_depth_meters = 0.05    only in water at least this deep
;   flood_recover_seconds = 120  flattened plants stand up again over this
;                                long once the water is gone (0 = never)
; Damage (static and body; models that do not exist yet are fine to leave out)
;   damage_newtons = 0           force (water, hits) that breaks it one step:
;                                intact -> damaged -> destroyed; 0 = unbreakable
;   damaged_model = name         data/objects/name.e3d once damaged
;   destroyed_model = name       once destroyed (no model: it disappears)
;   debris = name, name          object types thrown out when it is destroyed
;   debris_count = 4

; Growing: when a map is generated (or V regrows it) every type is spawned
; in the order of this file, so big things come first and the small ones
; fill the gaps. The planting brush (G) uses brush_per_hectare and the
; footprint, slope and water rules only: where to plant is the player's call.
;   spawn_per_hectare = 0        average number per hectare (10000 m2) where
;                                everything below allows it; 0 = never spawned
;   brush_per_hectare            density the brush plants up to (default: as
;                                dense as inside the patches, spawn_per_hectare
;                                times 1 + spawn_clustering; 0 = not plantable)
;   spawn_soils = all            sand, earth, clay, rock (any of them, comma
;                                separated) or all
;   spawn_slope_maximum_degrees = 90
;   spawn_height_minimum = 0     fraction of the map's highest point
;   spawn_height_maximum = 1
;   spawn_spacing_meters = 2     one candidate per square this big: keep it
;                                below 100 / sqrt(2 * spawn_per_hectare), or the
;                                type cannot reach its density inside patches
;   spawn_patch = name           types naming the same patch share its noise
;                                field (all trees grow in the same forests);
;                                !name grows outside the patches instead
;   spawn_clustering = 0         0 ignores the patches, 1 grows only in them
;   spawn_patch_meters = 50      typical patch size (the first type naming a
;                                patch sets it)
;   spawn_valley_preference = 0  -1 ridges .. 1 valley bottoms (river beds)
;   spawn_valley_minimum = -1    only where at least this deep in a valley
;   spawn_water_minimum_meters = 0      water standing there when spawned
;   spawn_water_maximum_meters = 0.02   (only matters on a map with water)
;   spawn_water_near_meters = 0  only this close to water (deeper than 10 cm),
;                                likelier the closer: willows, reeds
;   spawn_water_far_meters = 0   only at least this far from water
;                                (both: 0 = ignored; a map without water has
;                                no spot near it)
;   spawn_near = category        only where spawn_near_count of that category
;                                stand within spawn_near_meters, likelier up
;                                to that many: ferns under the trees. Only
;                                what was placed before it counts (this
;                                file's order); !category: where fewer do
;   spawn_near_meters = 10
;   spawn_near_count = 1
;   spawn_shelves = 0            on a shelf up the rock (soil with rock round
;                                it) this many times likelier than on
;                                average, its patch and valley aside: firs,
;                                bushes on the mountains' shelves

