; Weapons (src/weapons.h). One section per weapon; the testbed's first
; person has them in this order on 1, 2... (the key brings it up or puts
; it away, the left button fires, the right button aims, R reloads).
; Comments go on lines of their own.
;
; name                   shown
; ammo                   a section of ammo.ini
; fire                   semi (a shot a click), burst (burst_count a click), auto (while held)
; rounds_per_minute      how fast it fires
; magazine               rounds in a magazine
; reload_seconds         a new magazine; ready_seconds: to bring it up (or put it away)
; spread_degrees         the cone the first shot leaves in (half its angle)
; spread_per_shot_degrees  more for each shot in a row, up to spread_most_degrees;
;                        spread_recovery_degrees: a second, back
; recoil_degrees         the view kicked up a shot; recoil_sideways_degrees: to a side, at most
; muzzle_effect          particles.ini: the flash (its light lights round)
; tracer_effect          particles.ini: the streak; tracer_every: every so many shots (0: none)
; model                  procedural:rifle or procedural:scoped_rifle (until there are models)
; aim_seconds            to bring it up to the eye (the right button)
; aim_zoom               aimed down its sights the view narrows this many times
; scope_zoom             > 1: it has a scope; at the eye, the view through it narrows this many times
; aim_spread, aim_recoil aimed, the spread and the recoil times these
; noise_meters           a shot is heard this far (the animals: 300)
; infinite_ammo          true: never runs out, never reloads (a spell's)

[ak47]
name = AK-47
ammo = 7.62x39
fire = auto
rounds_per_minute = 600
magazine = 30
reload_seconds = 2.4
ready_seconds = 0.45
spread_degrees = 0.25
spread_per_shot_degrees = 0.18
spread_most_degrees = 2.5
spread_recovery_degrees = 5
recoil_degrees = 0.9
recoil_sideways_degrees = 0.35
muzzle_effect = muzzle_flash
tracer_effect = tracer
tracer_every = 4
model = procedural:rifle
aim_zoom = 1.35
aim_spread = 0.4
aim_recoil = 0.7

[svd]
name = SVD
ammo = 7.62x54R
fire = semi
rounds_per_minute = 150
magazine = 10
reload_seconds = 2.8
ready_seconds = 0.6
spread_degrees = 0.06
spread_per_shot_degrees = 0.3
spread_most_degrees = 2
spread_recovery_degrees = 3
recoil_degrees = 2.2
recoil_sideways_degrees = 0.5
muzzle_effect = muzzle_flash
tracer_effect = tracer
tracer_every = 0
model = procedural:scoped_rifle
aim_seconds = 0.3
aim_zoom = 1.5
scope_zoom = 6
aim_spread = 0.25
aim_recoil = 0.8

; A spell, as a rifle for now: its bolts turn to water where they hit
; (1000 m3 each, game.c); key 8
[water_rifle]
name = Water Rifle
ammo = water_bolt
fire = semi
rounds_per_minute = 60
magazine = 1
infinite_ammo = true
reload_seconds = 0
ready_seconds = 0.5
spread_degrees = 0.05
spread_per_shot_degrees = 0
spread_most_degrees = 0.5
spread_recovery_degrees = 3
recoil_degrees = 1.5
recoil_sideways_degrees = 0.3
muzzle_effect = muzzle_flash
tracer_effect = water_tracer
tracer_every = 1
model = procedural:scoped_rifle
aim_seconds = 0.3
aim_zoom = 1.5
scope_zoom = 6
aim_spread = 0.25
aim_recoil = 0.8
noise_meters = 150

